services:
  - type: web
    name: flowboard
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # cole a chave no painel do Render (nunca no código)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

databases:
  - name: flowboard-db
    plan: free
    region: ohio
    databaseName: flowboard
    user: flowboard_user
